- name: missing_sz
  description: "Ersetzt fehlendes ß",
  category: "orthography",
  pattern: "Stra\\s+e"
  replacement: "Straße"
  regex: true

- name: missing_umlaut_ae
  description: "Ersetzt fehlendes Umlaut-ä"
  category: "orthography"
  pattern: "Sch den"
  replacement: "Schäden"

- name: missing_umlaut_ue
  description="missing_umlaut_ue",
  category="missing_umlaut_ue",
  pattern: "f r"
  replacement: "für"

- name: published
  description: "Ersetzt fehlendes ö",
  category: "orthography",
  pattern: "ver ffentlicht"
  replacement: "veröffentlicht"