- name: missing_sz
  description: "Ersetzt fehlendes ß",
  category: "orthography",
  pattern: "Stra\\s+e"
  replacement: "Straße"
  regex: true

- name: missing_umlaut_ae
  description: "Ersetzt fehlendes Umlaut-ä"
  category: "orthography"
  pattern: "Sch den"
  replacement: "Schäden"

- name: missing_umlaut_ue
  description: "Ersetzt fehlendes Umlaut-ü"
  category: "orthography"
  pattern: "f r"
  replacement: "für"

- name: missing_umlaut_oe
  description: "Ersetzt fehlendes Umlaut-ö"
  category: "orthography"
  pattern: "ver ffentlicht"
  replacement: "veröffentlicht"

- name: euro_symbol
  description: "Ersetzt OCR-Fehler beim Euro-Zeichen."
  category: "orthography"
  pattern: "EU R"
  replacement: "EUR"
  regex: false